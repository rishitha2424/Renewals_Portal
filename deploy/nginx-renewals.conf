# ==============================================================================
# Nginx configuration for Mobileum Horizon Renewals on RHEL / Linux VM
# Place in /etc/nginx/conf.d/renewals.conf
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maximum upload size for large multi-sheet Excel renewal workbooks
    client_max_body_size 100M;

    # Frontend Single Page App static build directory
    # If installed in a custom directory, update this path or symlink to /opt/renewals/frontend/dist
    root /opt/renewals/frontend/dist;
    index index.html index.htm;

    # Cache immutable Vite static assets (JS, CSS, fonts, SVG)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Core API endpoints reverse proxy to Uvicorn backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check endpoints for load balancers and system monitors
    location ~ ^/(health|api/health) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Documentation & OpenAPI schema
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct routes without /api prefix
    location ~ ^/(compare|snapshots|upload) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA routing fallback: send all other requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
