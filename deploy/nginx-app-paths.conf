# IP-only application routing. Keep horizon.conf (port 3002) unchanged.
server {
    listen 80;
    server_name 10.10.51.71;
    client_max_body_size 500m;
    root /usr/share/nginx/html/mobileum;
    index index.html;

    location = /renewals { return 301 /renewals/; }
    location /renewals/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /renewals/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /renewals/index.html;
    }

    location = /operator { return 301 /operator/; }
    location /operator/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        # Scope the legacy portal's root URLs to its own path.
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter '/api/' '/operator/api/';
        sub_filter '/shared/' '/operator/shared/';
        sub_filter '"/sheet.html"' '"/operator/sheet.html"';
        sub_filter "'/sheet.html'" "'/operator/sheet.html'";
        sub_filter 'http://localhost:4001' 'http://$http_host/operator';
        sub_filter 'http://localhost:4002' 'http://$http_host/enterprise';
        sub_filter 'http://localhost:4003' 'http://$http_host/customer';
    }

    location = /enterprise { return 301 /enterprise/; }
    location /enterprise/ {
        proxy_pass http://127.0.0.1:4002/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        # Scope the legacy portal's root URLs to its own path.
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter '/api/' '/enterprise/api/';
        sub_filter '/shared/' '/enterprise/shared/';
        sub_filter '"/sheet.html"' '"/enterprise/sheet.html"';
        sub_filter "'/sheet.html'" "'/enterprise/sheet.html'";
        sub_filter 'http://localhost:4001' 'http://$http_host/operator';
        sub_filter 'http://localhost:4002' 'http://$http_host/enterprise';
        sub_filter 'http://localhost:4003' 'http://$http_host/customer';
    }

    location = /customer { return 301 /customer/; }
    location /customer/ {
        proxy_pass http://127.0.0.1:4003/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        # Scope the legacy portal's root URLs to its own path.
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter '/api/' '/customer/api/';
        sub_filter '/shared/' '/customer/shared/';
        sub_filter '"/sheet.html"' '"/customer/sheet.html"';
        sub_filter "'/sheet.html'" "'/customer/sheet.html'";
        sub_filter 'http://localhost:4001' 'http://$http_host/operator';
        sub_filter 'http://localhost:4002' 'http://$http_host/enterprise';
        sub_filter 'http://localhost:4003' 'http://$http_host/customer';
    }

    location / {
        # Serve the same Intelligence Portal as its existing port 3001.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
