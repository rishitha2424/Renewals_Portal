# ==============================================================================
# Mobileum Horizon - Nginx Reverse Proxy Configuration
# ==============================================================================
# Usage:
# 1. Docker Compose:
#    Used by frontend container to serve /usr/share/nginx/html and proxy to 'backend:8000'.
# 2. RHEL / CentOS / Ubuntu VM (without Docker):
#    Use deploy/nginx-renewals.conf in /etc/nginx/conf.d/renewals.conf
#    OR if using this file directly, change 'http://backend:8000' to 'http://127.0.0.1:8000'
#    and update 'root' to your built frontend path (e.g. /opt/renewals/frontend/dist).
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maximum upload size for large multi-sheet Excel renewal workbooks
    client_max_body_size 100M;

    # Static frontend assets root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Cache immutable Vite static assets (JS, CSS, fonts, SVG)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Core API endpoints reverse proxy to FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check endpoints for load balancers and system monitors
    location ~ ^/(health|api/health) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Documentation & OpenAPI schema
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct legacy/compatibility routes without /api prefix
    location ~ ^/(compare|snapshots|upload) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
